ktor {
    application {
        modules = [
            altak.ledger.infrastructure.ktor.ApplicationKt.rootModule,
            altak.ledger.TestDependenciesKt.testDependencies
        ]
    }
    di {
        conflictPolicy = "OverridePrevious"
    }
}

// Blanked rather than left out: HOCON merges this file with the one in main, so an absent key here
// still resolves to main's "seed.json" and a test would fill itself over HTTP against a live port.
ledger {
    seed = ""
}
